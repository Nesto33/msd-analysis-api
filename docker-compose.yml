version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: msd_postgres
    environment:
      POSTGRES_USER: msd_user
      POSTGRES_PASSWORD: msd_password
      POSTGRES_DB: msd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  